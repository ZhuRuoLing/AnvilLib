plugins {
    id 'java'
    alias libs.plugins.modDevGradle apply false
    alias libs.plugins.lombok apply false
    alias libs.plugins.machete apply false
    id 'org.jreleaser' version '1.23.0' apply false
    id "me.modmuss50.mod-publish-plugin" version "1.1.0" apply false
}

group = 'dev.anvilcraft.lib'
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {}

subprojects {
    if (it.name == "renderdoc-loader-internal") return
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'
    apply plugin: 'net.neoforged.moddev'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'io.github.p03w.machete'
    apply plugin: 'org.jreleaser'
    apply plugin: "me.modmuss50.mod-publish-plugin"

    apply from: rootProject.file("module.gradle")
}
